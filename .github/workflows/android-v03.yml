name: FamilyMedicalVault v0.3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - fmv-v0.3

permissions:
  contents: read

concurrency:
  group: familymedicalvault-v03
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore persistent signing key
        uses: actions/cache@v4
        with:
          path: .signing/fmv-debug.keystore
          key: familymedicalvault-stable-debug-signing-v1

      - name: Create signing key if missing
        shell: bash
        run: |
          mkdir -p .signing
          if [ ! -f .signing/fmv-debug.keystore ]; then
            keytool -genkeypair               -keystore .signing/fmv-debug.keystore               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=FamilyMedicalVault Debug,O=FamilyMedicalVault,C=GR"               -keyalg RSA               -keysize 2048               -validity 10000
          fi

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: gradle :app:lintDebug --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify restricted permissions are absent
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | tee /tmp/permissions.txt
          if grep -q "android.permission.INTERNET" /tmp/permissions.txt; then
            echo "INTERNET permission unexpectedly present"
            exit 1
          fi
          if grep -q "android.permission.MANAGE_EXTERNAL_STORAGE" /tmp/permissions.txt; then
            echo "MANAGE_EXTERNAL_STORAGE unexpectedly present"
            exit 1
          fi

      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyMedicalVault-v0.3.4-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
